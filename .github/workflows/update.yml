name: Update official Citron release

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-citron-release
  cancel-in-progress: false

env:
  # Upstream moved off GitHub during the November 2026 DMCA wave and now
  # publishes from its own Forgejo instance. The GitHub repository
  # (NextendoNetwork/citron-nextendo) no longer exists, so every upstream
  # read goes through the Forgejo API below. Our immutable mirrors stay on
  # GitHub releases; only the upstream source changed.
  FORGEJO_HOST: https://git.nextendo.network
  UPSTREAM_OWNER: NextendoNetwork
  UPSTREAM_REPO: citron-nextendo
  UPSTREAM_RELEASE_TAG: nightly-linux

jobs:
  update:
    name: Mirror verified official AppImages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out flake
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Discover successful official release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          forgejo_release() {
            curl --fail --location --retry 4 --silent --show-error \
              "${FORGEJO_HOST}/api/v1/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_RELEASE_TAG}"
          }

          release_json="$(forgejo_release)"
          if [[ "$(jq -er '.draft' <<<"$release_json")" != "false" ]]; then
            echo "Upstream release ${UPSTREAM_RELEASE_TAG} is a draft." >&2
            exit 1
          fi
          revision="$(jq -er \
            '.body | capture("commit/(?<sha>[0-9a-f]{40})").sha' \
            <<<"$release_json")"
          short_revision="${revision:0:9}"
          published_at="$(jq -er '.published_at' <<<"$release_json")"
          immutable_tag="linux-${short_revision}"

          # Forgejo's actions API exposes no runs for this repository
          # (builds are published directly as release assets), so there is
          # no successful-workflow gate to check. Assurance now rests on:
          # a published (non-draft) release, exactly one asset per
          # architecture, and byte-size agreement between the API and the
          # downloaded files (checked in the verify step).

          select_asset() {
            local label="$1"
            local regex="$2"
            jq -cer --arg label "$label" --arg regex "$regex" '
              [
                .assets[]
                | select(.name | test($regex))
                | select(.size | type == "number" and . > 0)
                | { name: .name, url: .browser_download_url, size: .size }
              ]
              | if length == 1 then .[0]
                else error("expected exactly one verified " + $label + " AppImage")
                end
            ' <<<"$release_json"
          }

          generic="$(select_asset x86_64 \
            "^citron_nightly-${short_revision}-linux-x86_64(-[A-Za-z0-9_-]+)?[.]AppImage$")"
          v3="$(select_asset x86_64_v3 \
            "^citron_nightly-${short_revision}-linux-x86_64_v3(-[A-Za-z0-9_-]+)?[.]AppImage$")"
          arm="$(select_asset aarch64 \
            "^citron_nightly-${short_revision}-linux-aarch64(-[A-Za-z0-9_-]+)?[.]AppImage$")"

          generic_name="$(jq -r '.name' <<<"$generic")"
          v3_name="$(jq -r '.name' <<<"$v3")"
          arm_name="$(jq -r '.name' <<<"$arm")"
          generic_url="$(jq -r '.url' <<<"$generic")"
          v3_url="$(jq -r '.url' <<<"$v3")"
          arm_url="$(jq -r '.url' <<<"$arm")"
          needs_mirror=true

          if own_release="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${immutable_tag}" \
            2>/dev/null)"; then
            for name in "$generic_name" "$v3_name" "$arm_name"; do
              upstream_size="$(jq -er --arg name "$name" \
                '.assets[] | select(.name == $name) | .size' \
                <<<"$release_json")"
              mirror_size="$(jq -er --arg name "$name" \
                '.assets[] | select(.name == $name) | .size' \
                <<<"$own_release")"
              if [[ "$mirror_size" != "$upstream_size" ]]; then
                echo "Immutable mirror $immutable_tag differs for $name." >&2
                exit 1
              fi
            done
            needs_mirror=false
          fi

          {
            echo "revision=$revision"
            echo "short_revision=$short_revision"
            echo "published_at=$published_at"
            echo "immutable_tag=$immutable_tag"
            echo "generic_name=$generic_name"
            echo "v3_name=$v3_name"
            echo "arm_name=$arm_name"
            echo "generic_url=$generic_url"
            echo "v3_url=$v3_url"
            echo "arm_url=$arm_url"
            echo "needs_mirror=$needs_mirror"
          } >>"$GITHUB_OUTPUT"

      - name: Download official AppImages
        if: steps.release.outputs.needs_mirror == 'true'
        shell: bash
        env:
          GENERIC_NAME: ${{ steps.release.outputs.generic_name }}
          GENERIC_URL: ${{ steps.release.outputs.generic_url }}
          V3_NAME: ${{ steps.release.outputs.v3_name }}
          V3_URL: ${{ steps.release.outputs.v3_url }}
          ARM_NAME: ${{ steps.release.outputs.arm_name }}
          ARM_URL: ${{ steps.release.outputs.arm_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/citron"
          cd "$RUNNER_TEMP/citron"
          download() {
            curl --fail --location --retry 4 --silent --show-error \
              --output "$1" "$2"
          }
          download "$GENERIC_NAME" "$GENERIC_URL"
          download "$V3_NAME" "$V3_URL"
          download "$ARM_NAME" "$ARM_URL"

      - name: Verify official SHA-256 digests
        if: steps.release.outputs.needs_mirror == 'true'
        shell: bash
        env:
          GENERIC_NAME: ${{ steps.release.outputs.generic_name }}
          V3_NAME: ${{ steps.release.outputs.v3_name }}
          ARM_NAME: ${{ steps.release.outputs.arm_name }}
        run: |
          set -euo pipefail
          # Forgejo publishes no per-asset digest, so byte integrity rests
          # on HTTPS from the upstream server plus agreement with the sizes
          # the API reported at discovery time. The computed digests below
          # become the pinned hashes in nix/sources.json.
          release_json="$(curl --fail --location --retry 4 --silent --show-error \
            "${FORGEJO_HOST}/api/v1/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_RELEASE_TAG}")"
          cd "$RUNNER_TEMP/citron"
          for name in "$GENERIC_NAME" "$V3_NAME" "$ARM_NAME"; do
            expected_size="$(jq -er --arg name "$name" \
              '.assets[] | select(.name == $name) | .size' \
              <<<"$release_json")"
            actual_size="$(stat -c%s "$name")"
            if [[ "$actual_size" != "$expected_size" ]]; then
              echo "Size mismatch for $name: got $actual_size, want $expected_size." >&2
              exit 1
            fi
          done
          sha256sum ./*.AppImage | sort -k2 >SHA256SUMS

      - name: Publish immutable byte-for-byte mirror
        if: steps.release.outputs.needs_mirror == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.release.outputs.revision }}
          SHORT_REVISION: ${{ steps.release.outputs.short_revision }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable_tag }}
        run: |
          set -euo pipefail
          notes="Byte-for-byte mirror of the official Nextendo Linux AppImages published at ${PUBLISHED_AT}. No independent build was performed. Upstream commit: ${FORGEJO_HOST}/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/commit/${REVISION}"
          gh release create "$IMMUTABLE_TAG" \
            "$RUNNER_TEMP"/citron/*.AppImage \
            "$RUNNER_TEMP/citron/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Citron Nextendo Linux ${SHORT_REVISION}" \
            --notes "$notes"

      - name: Generate fixed Nix metadata
        shell: bash
        env:
          REVISION: ${{ steps.release.outputs.revision }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          IMMUTABLE_TAG: ${{ steps.release.outputs.immutable_tag }}
          GENERIC_NAME: ${{ steps.release.outputs.generic_name }}
          V3_NAME: ${{ steps.release.outputs.v3_name }}
          ARM_NAME: ${{ steps.release.outputs.arm_name }}
          NEEDS_MIRROR: ${{ steps.release.outputs.needs_mirror }}
        run: |
          set -euo pipefail

          sri_of_file() {
            python3 - "$1" <<'PY'
          import base64
          import hashlib
          import sys

          print("sha256-" + base64.b64encode(
              hashlib.sha256(open(sys.argv[1], "rb").read()).digest()
          ).decode())
          PY
          }
          asset_url() {
            printf 'https://github.com/%s/releases/download/%s/%s\n' \
              "$GITHUB_REPOSITORY" "$IMMUTABLE_TAG" "$1"
          }

          if [[ "$NEEDS_MIRROR" == "true" ]]; then
            generic_hash="$(sri_of_file "$RUNNER_TEMP/citron/$GENERIC_NAME")"
            v3_hash="$(sri_of_file "$RUNNER_TEMP/citron/$V3_NAME")"
            arm_hash="$(sri_of_file "$RUNNER_TEMP/citron/$ARM_NAME")"
          else
            # Metadata already mirrors this release; reuse its pinned hashes.
            generic_hash="$(jq -er '.sources["x86_64-linux"].hash' nix/sources.json)"
            v3_hash="$(jq -er '.sources["x86_64-linux-v3"].hash' nix/sources.json)"
            arm_hash="$(jq -er '.sources["aarch64-linux"].hash' nix/sources.json)"
          fi

          icon_url="${FORGEJO_HOST}/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/raw/commit/${REVISION}/dist/citron.svg"
          rules_url="${FORGEJO_HOST}/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/raw/commit/${REVISION}/dist/72-citron-input.rules"
          curl --fail --location --retry 4 --silent --show-error \
            "$icon_url" --output "$RUNNER_TEMP/citron.svg"
          curl --fail --location --retry 4 --silent --show-error \
            "$rules_url" --output "$RUNNER_TEMP/72-citron-input.rules"
          icon_hash="$(sri_of_file "$RUNNER_TEMP/citron.svg")"
          rules_hash="$(sri_of_file "$RUNNER_TEMP/72-citron-input.rules")"

          jq -n \
            --arg revision "$REVISION" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg officialRelease "$UPSTREAM_RELEASE_TAG" \
            --arg releaseTag "$IMMUTABLE_TAG" \
            --arg genericUrl "$(asset_url "$GENERIC_NAME")" \
            --arg genericHash "$generic_hash" \
            --arg v3Url "$(asset_url "$V3_NAME")" \
            --arg v3Hash "$v3_hash" \
            --arg armUrl "$(asset_url "$ARM_NAME")" \
            --arg armHash "$arm_hash" \
            --arg iconUrl "$icon_url" \
            --arg iconHash "$icon_hash" \
            --arg rulesUrl "$rules_url" \
            --arg rulesHash "$rules_hash" \
            '{
              revision: $revision,
              publishedAt: $publishedAt,
              officialRelease: $officialRelease,
              releaseTag: $releaseTag,
              sources: {
                "x86_64-linux": { url: $genericUrl, hash: $genericHash },
                "x86_64-linux-v3": { url: $v3Url, hash: $v3Hash },
                "aarch64-linux": { url: $armUrl, hash: $armHash }
              },
              icon: { url: $iconUrl, hash: $iconHash },
              inputRules: { url: $rulesUrl, hash: $rulesHash }
            }' >nix/sources.json.new
          mv nix/sources.json.new nix/sources.json
          jq empty nix/sources.json

      - name: Commit metadata update
        shell: bash
        env:
          SHORT_REVISION: ${{ steps.release.outputs.short_revision }}
        run: |
          set -euo pipefail
          if git diff --quiet -- nix/sources.json; then
            echo "Nix metadata is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/sources.json
          git commit -m "chore: package official Citron ${SHORT_REVISION}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying." >&2
          done
          exit 1
